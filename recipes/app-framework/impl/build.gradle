plugins {
    id 'software.ralf.app.platform'

    // This plugin lives in the buildSrc directory and is not published.
    // It's used to manage certain configurations and dependencies for all
    // :recipes:* modules, otherwise we'd need to repeat them several times.
    id 'software.ralf.app.platform.app.kmp'
}

// This extension comes from our published plugin.
appPlatform {
    enableComposeUi true
    enableKotlinInject true
    enableModuleStructure {
        enableDependencyCheck false
    }
    enableComposePresenters true
    addImplModuleDependencies true
}

appPlatformBuildSrc {
    enableAndroidResources true
}

dependencies {
    commonMainImplementation project(':recipes:common:impl')

    androidMainImplementation libs.androidx.activity.compose
}
