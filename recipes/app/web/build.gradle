plugins {
    id 'software.ralf.app.platform'

    // This plugin lives in the buildSrc directory and is not published.
    id 'software.ralf.app.platform.app.kmp'
}

appPlatform {
    enableComposeUi true
    enableKotlinInject true
    enableModuleStructure true
    enableComposePresenters true
    addImplModuleDependencies true
}

kotlin {
    sourceSets {
        wasmJsMain {
            dependencies {
                // The recipes Wasm bundle imports this npm runtime.
                implementation npm('@js-joda/core', '3.2.0')
            }
        }
    }
}

dependencies {
    commonMainImplementation project(':recipes:app-framework:impl')
}
