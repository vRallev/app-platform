# Simple workflow for deploying static content to GitHub Pages
name: Deploy Wiki

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Builds the wiki for pull requests without deploying it.
  pull_request:

  # Allows to run this workflow manually from the Actions tab.
  workflow_dispatch:

# Build jobs only need to read the repository. The deployment job grants its
# additional permissions separately.
permissions:
  contents: read

# Cancel outdated builds for the same pull request without affecting other pull
# requests or production builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-wasm-sample-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build wasm binary
        run: ./gradlew :sample:app:wasmJsBrowserDistribution :recipes:app:wasmJsBrowserDistribution

      - name: Upload wasm binaries
        uses: actions/upload-artifact@v4
        with:
          name: wasm-files
          path: |
            ./sample/app/build/dist/wasmJs/productionExecutable/
            ./recipes/app/build/dist/wasmJs/productionExecutable/

  build-mkdocs:
    needs: build-wasm-sample-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Download wasm binaries
        uses: actions/download-artifact@v4
        with:
          name: wasm-files
          path: docs/web
      - run: |
          cp CHANGELOG.md docs/changelog.md
      - run: |
          pip install mkdocs-material
          pip install "mkdocs-material[imaging]"
      - run: mkdocs build --config-file mkdocs.yml
      - name: Upload wiki
        uses: actions/upload-artifact@v4
        with:
          name: wiki
          path: site

  deploy-mkdocs:
    needs: build-mkdocs
    if: github.repository == 'vRallev/app-platform' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download wiki
        uses: actions/download-artifact@v4
        with:
          name: wiki
          path: site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
