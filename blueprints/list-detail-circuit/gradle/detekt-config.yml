# Detekt configuration tweaks. These are documented at
#   https://detekt.dev/docs/rules/configurations/
#   https://detekt.dev/docs/rules/comments/
# Also helpful are the Detekt default settings at
#   https://github.com/detekt/detekt/blob/main/detekt-core/src/main/resources/default-detekt-config.yml
style:
  DataClassShouldBeImmutable:
    active: true
  MagicNumber:
    active: false
  UnusedPrivateClass:
    # Recommended for Compose: https://detekt.dev/docs/introduction/compose/
    ignoreAnnotated: ['Preview']
  UnusedPrivateFunction:
    # Recommended for Compose: https://detekt.dev/docs/introduction/compose/
    ignoreAnnotated: ['Preview']
  UnusedPrivateProperty:
    # Recommended for Compose: https://detekt.dev/docs/introduction/compose/
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
comments:
  DeprecatedBlockTag:
    active: true
  EndOfSentenceFormat:
    active: true
  UndocumentedPublicClass:
    active: true
    ignoreDefaultCompanionObject: true
    # Require API documentation at public module boundaries. Implementation walkthroughs live in docs/.
    includes: ['**/public/src/**/*.kt']
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
  UndocumentedPublicFunction:
    active: true
    includes: ['**/public/src/**/*.kt']
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
  UndocumentedPublicProperty:
    active: true
    includes: ['**/public/src/**/*.kt']
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
complexity:
  ComplexCondition:
    active: false
  LongParameterList:
    allowedConstructorParameters: 12
    ignoreAnnotatedParameter: [
      'Inject',
    ]
    # The next two parameters are recommended for Compose: https://detekt.dev/docs/introduction/compose/
    allowedFunctionParameters: 12
    ignoreDefaultParameters: true
  TooManyFunctions:
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true
  LargeClass:
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
  LongMethod:
    active: false
naming:
  InvalidPackageDeclaration:
    active: true
  FunctionNaming:
    # The next two parameters are recommended for Compose: https://detekt.dev/docs/introduction/compose/
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ignoreAnnotated: ['Composable']
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
